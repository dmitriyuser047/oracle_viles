<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Велес — AI Оракул</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #08080f;
    color: #e8e4f0;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 100vw;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: radial-gradient(ellipse at 50% -10%, #1c1050 0%, #08080f 60%);
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.15; } 100% { opacity: 0.6; } }

  .screen { display: none; flex-direction: column; flex: 1; position: relative; z-index: 1; }
  .screen.active { display: flex; }

  .header {
    text-align: center;
    padding: 52px 20px 14px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute; bottom: 0; left: 16px; right: 16px;
    height: 0.5px; background: linear-gradient(90deg, transparent, rgba(120,90,200,0.15), transparent);
  }
  .header-label {
    font-size: 9px; letter-spacing: 4px; color: #7b6baa;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .header-title {
    font-size: 26px; font-weight: 600; color: #e8e4f0;
    letter-spacing: 1px;
  }
  .header-sub {
    font-size: 12px; color: #6a5a9a; margin-top: 4px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .header-sub::before, .header-sub::after {
    content: ''; width: 16px; height: 0.5px; background: #3a2a6a;
  }

  /* Chat */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 16px 16px 8px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .msg { margin-bottom: 14px; animation: fadeUp 0.5s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .msg-oracle {
    background: linear-gradient(145deg, rgba(30,20,70,0.9) 0%, rgba(18,12,45,0.9) 100%);
    border: 0.5px solid rgba(100,70,180,0.2);
    border-radius: 18px 18px 18px 4px;
    padding: 16px 18px; max-width: 90%;
    backdrop-filter: blur(10px);
  }
  .msg-oracle p { font-size: 14.5px; color: #ccc4e4; line-height: 1.7; }
  .msg-oracle .accent { color: #c4b0f0; font-weight: 500; }
  .msg-oracle .meta {
    font-size: 10px; color: #5a4a80; margin-top: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .msg-oracle .meta-dot {
    width: 5px; height: 5px;
    background: #7b6baa; border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  .msg-user-wrap { display: flex; justify-content: flex-end; margin-bottom: 14px; animation: fadeUp 0.3s ease; }
  .msg-user {
    background: linear-gradient(135deg, #2e2070, #241868);
    border: 0.5px solid rgba(80,60,160,0.3);
    border-radius: 18px 18px 4px 18px;
    padding: 12px 18px; max-width: 82%;
    font-size: 14.5px; color: #dcd4f4; line-height: 1.55;
  }

  /* Pattern card */
  .pattern-card {
    background: linear-gradient(145deg, rgba(35,20,75,0.95) 0%, rgba(25,14,55,0.95) 100%);
    border: 0.5px solid rgba(120,80,220,0.25);
    border-radius: 16px;
    padding: 16px 18px; margin-bottom: 14px;
    animation: fadeUp 0.6s ease;
  }
  .pattern-card .label {
    font-size: 9px; color: #9b8bca; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .pattern-icon {
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(120,80,220,0.15); border: 1px solid rgba(120,80,220,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .pattern-icon-inner {
    width: 6px; height: 6px; background: #9b8bca; border-radius: 50%;
  }
  .pattern-card p { font-size: 13.5px; color: #a098c0; line-height: 1.6; }
  .pattern-card .hl { color: #e0d0ff; font-weight: 500; }

  /* Viral card */
  .viral-card {
    background: rgba(100,70,180,0.05);
    border: 0.5px solid rgba(100,70,180,0.12);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 14px;
    animation: fadeUp 0.6s ease 0.2s both;
  }
  .viral-card p { font-size: 13.5px; color: #8a7ab8; line-height: 1.6; margin-bottom: 12px; }
  .viral-btns { display: flex; gap: 8px; }
  .viral-btns button {
    flex: 1; padding: 11px; border-radius: 12px;
    font-size: 13.5px; border: none; cursor: pointer;
    transition: all 0.2s; font-family: inherit; font-weight: 500;
  }
  .viral-btns button:active { transform: scale(0.96); }
  .btn-send {
    background: linear-gradient(135deg, rgba(120,80,220,0.25), rgba(100,60,200,0.15));
    color: #c4b0f0;
    border: 0.5px solid rgba(120,80,220,0.3) !important;
  }
  .btn-later { background: transparent; color: #4a4470; border: 0.5px solid rgba(100,70,180,0.1) !important; }

  /* Input bar */
  .input-bar {
    padding: 8px 16px 30px; display: flex; gap: 10px;
    align-items: center;
    background: linear-gradient(transparent 0%, #08080f 50%);
    position: sticky; bottom: 0;
  }
  .composer {
    position: sticky; bottom: 0;
    background: linear-gradient(transparent 0%, #08080f 32%);
  }
  .oracle-modes {
    padding: 12px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .mode-btn {
    height: 36px; border-radius: 18px; border: 0.5px solid rgba(100,70,180,0.16);
    background: rgba(255,255,255,0.035); color: #80759f; font-size: 13px;
    font-family: inherit; cursor: pointer; transition: all 0.2s;
  }
  .mode-btn.active {
    color: #e7ddff; border-color: rgba(150,115,230,0.38);
    background: rgba(120,80,220,0.16);
  }
  .mode-btn:active { transform: scale(0.97); }
  .input-bar input {
    flex: 1; background: rgba(255,255,255,0.04);
    border: 0.5px solid rgba(100,70,180,0.15); border-radius: 24px;
    padding: 13px 20px; font-size: 14.5px; color: #e8e4f0;
    outline: none; font-family: inherit;
    transition: all 0.2s;
  }
  .input-bar input::placeholder { color: #3e3860; }
  .input-bar input:focus { border-color: rgba(120,80,220,0.4); background: rgba(255,255,255,0.06); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(145deg, #7b5fd0, #5a3fa8);
    border: none; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:active { transform: scale(0.88); }
  .send-btn:hover { box-shadow: 0 0 24px rgba(120,80,220,0.5); }
  .send-btn svg { width: 18px; height: 18px; }

  /* Typing */
  .typing { display: flex; gap: 5px; padding: 16px 18px; align-items: center; }
  .typing span {
    width: 7px; height: 7px; background: #7b6baa; border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.25; } 40% { transform: translateY(-10px); opacity: 1; } }

  /* Bottom nav */
  .nav {
    display: flex; justify-content: space-around;
    padding: 8px 8px 26px;
    border-top: 0.5px solid rgba(100,70,180,0.06);
    position: sticky; bottom: 0; z-index: 10;
    background: rgba(8,8,15,0.95);
    backdrop-filter: blur(12px);
  }
  .nav-item {
    text-align: center; cursor: pointer;
    padding: 6px 14px; border-radius: 14px;
    transition: all 0.2s;
    position: relative;
  }
  .nav-item:active { background: rgba(120,80,220,0.1); }
  .nav-item svg { width: 24px; height: 24px; margin-bottom: 2px; }
  .nav-item .nav-label { font-size: 10px; color: #3e3860; font-weight: 500; }
  .nav-item.active .nav-label { color: #b8a8e8; }
  .nav-item.active svg { color: #b8a8e8; }
  .nav-item svg { color: #3e3860; transition: color 0.2s; }
  .nav-dot {
    position: absolute; top: 4px; right: 12px;
    width: 6px; height: 6px; background: #7b5fd0;
    border-radius: 50%; display: none;
  }

  /* Onboarding */
  .onboarding {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 28px; text-align: center;
  }
  .eye-symbol { margin-bottom: 28px; position: relative; }
  .eye-glow {
    position: absolute; inset: -20px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,80,220,0.15) 0%, transparent 70%);
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }

  .onboarding h1 {
    font-size: 36px; font-weight: 700; margin-bottom: 6px; color: #e8e4f0;
    letter-spacing: 2px;
  }
  .onboarding .subtitle {
    font-size: 14px; color: #6a5a9a; margin-bottom: 44px; line-height: 1.6;
  }
  .onboarding .form-group { width: 100%; margin-bottom: 14px; position: relative; }
  .onboarding .form-label {
    font-size: 11px; color: #6a5a9a; letter-spacing: 1px;
    text-transform: uppercase; text-align: left;
    margin-bottom: 6px; display: block; padding-left: 4px;
  }
  .onboarding input {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 0.5px solid rgba(100,70,180,0.15); border-radius: 14px;
    padding: 15px 18px; font-size: 16px; color: #e8e4f0;
    outline: none; font-family: inherit;
    transition: all 0.2s;
  }
  .onboarding input::placeholder { color: #3e3860; }
  .onboarding input:focus { border-color: rgba(120,80,220,0.4); background: rgba(255,255,255,0.06); }
  .start-btn {
    width: 100%; padding: 17px;
    background: linear-gradient(145deg, #7b5fd0, #5a3fa8);
    border: none; border-radius: 16px;
    color: #f0ecf8; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 12px;
    transition: all 0.2s;
    font-family: inherit; letter-spacing: 0.5px;
  }
  .start-btn:active { transform: scale(0.97); }
  .start-btn:hover { box-shadow: 0 6px 30px rgba(120,80,220,0.45); }
  .onboarding .hint {
    font-size: 11px; color: #4a3a70; margin-top: 20px; line-height: 1.5;
  }

  /* Diary */
  .diary-list { flex: 1; padding: 0 16px; overflow-y: auto; padding-bottom: 80px; }
  .diary-patterns {
    margin-bottom: 18px;
  }
  .diary-section-label {
    font-size: 9px; color: #7b6baa; letter-spacing: 3px;
    text-transform: uppercase; margin: 0 2px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .diary-pattern {
    background: linear-gradient(145deg, rgba(40,25,85,0.95), rgba(18,12,45,0.95));
    border: 0.5px solid rgba(140,100,240,0.22);
    border-radius: 16px;
    padding: 16px 18px; margin-bottom: 10px;
  }
  .diary-pattern-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 8px;
  }
  .diary-pattern-title { font-size: 14px; color: #e0d0ff; font-weight: 600; }
  .diary-pattern-count {
    font-size: 11px; color: #b8a8e8; padding: 4px 8px;
    border-radius: 999px; background: rgba(120,80,220,0.12);
    border: 0.5px solid rgba(120,80,220,0.22);
    flex-shrink: 0;
  }
  .diary-pattern-desc { font-size: 13.5px; color: #a098c0; line-height: 1.55; margin-bottom: 10px; }
  .diary-pattern-advice {
    font-size: 12.5px; color: #c8c0e0; line-height: 1.5;
    padding-top: 10px; border-top: 0.5px solid rgba(100,70,180,0.1);
  }
  .diary-pattern-empty {
    background: rgba(100,70,180,0.05);
    border: 0.5px solid rgba(100,70,180,0.12);
    border-radius: 16px;
    padding: 16px 18px; margin-bottom: 18px;
    font-size: 13.5px; color: #7a6aa8; line-height: 1.6;
  }
  .diary-entry {
    background: linear-gradient(145deg, rgba(30,20,70,0.9), rgba(18,12,45,0.9));
    border: 0.5px solid rgba(100,70,180,0.15);
    border-radius: 16px;
    padding: 16px 18px; margin-bottom: 10px;
  }
  .diary-entry .date {
    font-size: 11px; color: #7b6baa; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .diary-entry .date::before {
    content: ''; width: 4px; height: 4px; background: #7b6baa;
    border-radius: 50%;
  }
  .diary-entry .text { font-size: 14px; color: #c8c0e0; line-height: 1.55; }
  .diary-entry .transit {
    font-size: 11px; color: #4a3a70; margin-top: 10px;
    padding-top: 10px; border-top: 0.5px solid rgba(100,70,180,0.08);
    display: flex; gap: 12px;
  }

  .add-entry-btn {
    position: fixed; bottom: 84px; right: calc(50% - 215px + 16px);
    width: 52px; height: 52px; border-radius: 16px;
    background: linear-gradient(145deg, #7b5fd0, #5a3fa8);
    border: none; cursor: pointer; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(120,80,220,0.4);
    transition: all 0.2s;
    font-size: 22px; color: #f0ecf8;
  }
  .add-entry-btn:active { transform: scale(0.9); }

  /* Profile */
  .profile-content { flex: 1; padding: 0 16px; overflow-y: auto; padding-bottom: 20px; }
  .profile-header {
    text-align: center; margin-bottom: 20px;
  }
  .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(145deg, rgba(120,80,220,0.2), rgba(80,50,180,0.1));
    border: 1px solid rgba(120,80,220,0.2);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px; font-size: 28px;
  }
  .profile-name { font-size: 18px; font-weight: 600; color: #e8e4f0; }
  .profile-sign { font-size: 13px; color: #7b6baa; margin-top: 2px; }

  .profile-card {
    background: linear-gradient(145deg, rgba(30,20,70,0.9), rgba(18,12,45,0.9));
    border: 0.5px solid rgba(100,70,180,0.15);
    border-radius: 16px;
    padding: 18px; margin-bottom: 12px;
  }
  .profile-card .card-label {
    font-size: 9px; letter-spacing: 3px; color: #7b6baa;
    text-transform: uppercase; margin-bottom: 14px;
  }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 0.5px solid rgba(100,70,180,0.06);
  }
  .stat-row:last-child { border: none; }
  .stat-label { font-size: 13.5px; color: #8a7aaa; }
  .stat-value { font-size: 13.5px; color: #ccc4e4; font-weight: 500; }
  .stat-value.warn { color: #e8a888; }
  .stat-value.good { color: #88d8b8; }
  .stat-value.accent { color: #c4b0f0; }

  /* Bonds */
  .bonds-content { flex: 1; padding: 0 16px; overflow-y: auto; }
  .bond-empty { text-align: center; padding: 60px 20px; }
  .bond-empty-icon {
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(120,80,220,0.06);
    border: 0.5px solid rgba(120,80,220,0.1);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .bond-empty p { font-size: 14.5px; color: #6a5a9a; line-height: 1.65; margin-bottom: 24px; }
  .invite-btn {
    padding: 15px 36px;
    background: linear-gradient(145deg, #7b5fd0, #5a3fa8);
    border: none; border-radius: 14px;
    color: #f0ecf8; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s; letter-spacing: 0.3px;
  }
  .invite-btn:active { transform: scale(0.96); }
  .invite-btn:hover { box-shadow: 0 6px 24px rgba(120,80,220,0.4); }

  .screen-title {
    font-size: 22px; font-weight: 600; color: #e8e4f0;
    padding: 52px 20px 20px; text-align: center;
    letter-spacing: 0.5px;
  }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(145deg, #2e2070, #241868);
    color: #c4b0f0; padding: 12px 24px; border-radius: 14px;
    font-size: 14px; z-index: 99; animation: fadeUp 0.3s ease;
    border: 0.5px solid rgba(120,80,220,0.3);
    font-weight: 500;
  }

  /* Matrix diagram */
  .matrix-wrap {
    padding: 8px 0 16px; text-align: center;
  }
  .matrix-wrap svg { max-width: 100%; height: auto; }
  .matrix-node-circle { fill: rgba(120,80,220,0.15); stroke: rgba(120,80,220,0.4); stroke-width: 1.5; }
  .matrix-node-center { fill: rgba(120,80,220,0.25); stroke: rgba(180,140,255,0.5); stroke-width: 2; }
  .matrix-num { fill: #c4b0f0; font-size: 14px; font-weight: 700; font-family: inherit; }
  .matrix-label { fill: #6a5a9a; font-size: 8px; font-family: inherit; letter-spacing: 0.5px; }
  .matrix-line { stroke: rgba(120,80,220,0.2); stroke-width: 1; }
  .matrix-line-main { stroke: rgba(120,80,220,0.35); stroke-width: 1.5; }

  /* Daily forecast */
  .forecast-card {
    background: linear-gradient(145deg, rgba(40,25,85,0.95) 0%, rgba(20,12,50,0.95) 100%);
    border: 0.5px solid rgba(140,100,240,0.25);
    border-radius: 18px;
    padding: 20px 18px; margin-bottom: 16px;
    animation: fadeUp 0.6s ease;
  }
  .forecast-header {
    font-size: 9px; letter-spacing: 3px; color: #9b8bca;
    text-transform: uppercase; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .forecast-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 0.5px solid rgba(100,70,180,0.08);
  }
  .forecast-row:last-child { border: none; }
  .forecast-key { font-size: 12px; color: #8a7aaa; }
  .forecast-val { font-size: 12px; color: #c4b0f0; font-weight: 500; }
  .forecast-advice {
    margin-top: 14px; padding-top: 12px;
    border-top: 0.5px solid rgba(100,70,180,0.12);
    font-size: 13.5px; color: #a098c0; line-height: 1.65;
    font-style: italic;
  }

  @media (max-width: 430px) {
    .add-entry-btn { right: 16px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="stars" id="stars"></div>

  <!-- ОНБОРДИНГ -->
  <div class="screen active" id="screen-onboard">
    <div class="onboarding">
      <div class="eye-symbol">
        <div class="eye-glow"></div>
        <svg width="88" height="88" viewBox="0 0 88 88">
          <circle cx="44" cy="44" r="32" fill="none" stroke="#6a50b0" stroke-width="0.5" opacity="0.3"/>
          <circle cx="44" cy="44" r="24" fill="none" stroke="#8a70d0" stroke-width="0.5" opacity="0.2"/>
          <ellipse cx="44" cy="44" rx="16" ry="9" fill="none" stroke="#b8a0e8" stroke-width="1.2"/>
          <circle cx="44" cy="44" r="5" fill="#b8a0e8"/>
          <circle cx="44" cy="44" r="2" fill="#08080f"/>
          <circle cx="42" cy="42" r="1" fill="rgba(255,255,255,0.4)"/>
        </svg>
      </div>
      <h1>Велес</h1>
      <div class="subtitle">Оракул, который знает тебя.<br>Расскажи, когда ты родился.</div>
      <div class="form-group">
        <label class="form-label">Твоё имя</label>
        <input type="text" id="nameInput" placeholder="Как тебя зовут?">
      </div>
      <div class="form-group">
        <label class="form-label">Дата рождения</label>
        <input type="date" id="birthInput" style="color-scheme: dark;">
      </div>
      <button class="start-btn" onclick="startApp()">Открыть глаз</button>
      <div class="hint">Данные нужны для расчёта натальной карты<br>и нумерологического профиля</div>
    </div>
  </div>

  <!-- ОРАКУЛ -->
  <div class="screen" id="screen-oracle">
    <div class="header">
      <div class="header-label">Оракул</div>
      <div class="header-title">Велес</div>
      <div class="header-sub" id="userSign"></div>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="composer">

function saveToStorage() {
  try {
    localStorage.setItem('veles_user', JSON.stringify({
      name: userName,
      birth: userBirthValue,
      events: events.map(function(e) { return { text: e.text, ts: e.date.getTime() }; })
    }));
  } catch(e) {}
}

function loadFromStorage() {
  try {
    var data = JSON.parse(localStorage.getItem('veles_user'));
    if (data && data.name && data.birth) {
      userName = data.name;
      userBirthValue = data.birth;
      userBirth = new Date(data.birth);

        events = data.events.map(function(e) { return { text: e.text, date: new Date(e.ts) }; });
      }
      return true;
    }
  } catch(e) {}
  return false;
}

function clearStorage() {
  try { localStorage.removeItem('veles_user'); } catch(e) {}

function getZodiac(month, day) {
  const cutoffs = [
    [1,20,10],[2,19,11],[3,21,0],[4,20,1],[5,21,2],[6,21,3],
    [7,23,4],[8,23,5],[9,23,6],[10,23,7],[11,22,8],[12,22,9]
  ];
  var sign = cutoffs[month-1][2];
  if (day < cutoffs[month-1][1]) sign = (sign + 11) % 12;
  return sign;
}

function lifePathNumber(dateStr) {
  let sum = dateStr.replace(/-/g,'').split('').reduce((a,b) => a + parseInt(b), 0);
  while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
    sum = String(sum).split('').reduce((a,b) => a + parseInt(b), 0);
  }
  return sum;
}

function reduceNum(n) {
  while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
    n = String(n).split('').reduce(function(a,b) { return a + parseInt(b); }, 0);
  }
  return n;
}

function cyrNumValue(ch) {
  var c = ch.toLowerCase();
  var cyr = 'абвгдежзиклмнопрстуфхцчшщъыьэюя';
  var lat = 'abcdefghijklmnopqrstuvwxyz';
  var idx = cyr.indexOf(c);
  if (idx >= 0) return (idx % 9) + 1;
  idx = lat.indexOf(c);
  if (idx >= 0) return (idx % 9) + 1;
  return 0;
}

function destinyNumber(name) {
  var sum = name.split('').reduce(function(a,c) { return a + cyrNumValue(c); }, 0);
  return reduceNum(sum);
}

function soulNumber(name) {
  var vowels = 'аеёиоуыэюяaeiou';
  var sum = name.toLowerCase().split('').filter(function(c) { return vowels.indexOf(c) >= 0; }).reduce(function(a,c) { return a + cyrNumValue(c); }, 0);
  return reduceNum(sum);
}

function personalityNum(name) {
  var vowels = 'аеёиоуыэюяaeiou';
  var all = 'абвгдежзиклмнопрстуфхцчшщэюяabcdefghijklmnopqrstuvwxyz';
  var sum = name.toLowerCase().split('').filter(function(c) { return all.indexOf(c) >= 0 && vowels.indexOf(c) < 0; }).reduce(function(a,c) { return a + cyrNumValue(c); }, 0);
  return reduceNum(sum);
}

function birthdayNum(day) { return reduceNum(day); }

function maturityNum(lifePath, destiny) { return reduceNum(lifePath + destiny); }

function personalYear(bDay, bMonth) {
  var y = new Date().getFullYear();
  var digits = String(bDay) + String(bMonth) + String(y);
  return reduceNum(digits.split('').reduce(function(a,b) { return a + parseInt(b); }, 0));
}

function personalMonth(bDay, bMonth) {
  var py = personalYear(bDay, bMonth);
  return reduceNum(py + new Date().getMonth() + 1);
}

function personalDay(bDay, bMonth) {
  var pm = personalMonth(bDay, bMonth);
  return reduceNum(pm + new Date().getDate());
}

function reduceToRange(n, max) {
  while (n > max) {
    n = String(n).split('').reduce(function(a,b) { return a + parseInt(b); }, 0);
  }
  return n <= 0 ? max : n;
}

function getLunarDayMeaning(day) {
  return lunarDayMeanings[(Math.max(1, day) - 1) % lunarDayMeanings.length];
}

function getAlchemyStage(message) {
  var text = oracleText(message);
  var pd = userBirth ? personalDay(userBirth.getDate(), userBirth.getMonth() + 1) : 1;
  if (hasAny(text, ['кризис','больно','разруш','конец','страх','тревог','потер','плохо'])) return alchemyStages[0];
  if (hasAny(text, ['отпустить','очист','устал','пауза','восстанов','простить'])) return alchemyStages[1];
  if (hasAny(text, ['понять','смысл','выбор','решить','зачем','куда','путь'])) return alchemyStages[2];
  if (hasAny(text, ['запуск','начать','сделать','действ','прояв','договор','письмо'])) return alchemyStages[3];
  return alchemyStages[(pd - 1) % alchemyStages.length];
}

function getElementBalance(message) {
  var text = oracleText(message);
  var scores = {
    Огонь: elements[userSignIdx] === 'Огонь' ? 2 : 0,
    Земля: elements[userSignIdx] === 'Земля' ? 2 : 0,
    Воздух: elements[userSignIdx] === 'Воздух' ? 2 : 0,
    Вода: elements[userSignIdx] === 'Вода' ? 2 : 0
  };
  scores.Огонь += countAny(text, ['зл','смел','начать','действ','страст','прояв','побед']);
  scores.Земля += countAny(text, ['деньг','тело','дом','работ','стабил','безопас','практи']);
  scores.Воздух += countAny(text, ['дум','слово','письм','разговор','иде','сомнев','объясн']);
  scores.Вода += countAny(text, ['чувств','любов','страх','тревог','сон','интуиц','слез']);
  var entries = Object.keys(scores).map(function(k) { return { name:k, score:scores[k] }; }).sort(function(a,b) { return b.score - a.score; });
  var need = entries[entries.length - 1].name;
  return {
    dominant: entries[0].name,
    missing: need,
    meaning: 'ведущая стихия сейчас — ' + entries[0].name + ', а для равновесия нужна ' + need,
    practice: elementPractice(need)
  };
}

function elementPractice(element) {
  if (element === 'Огонь') return 'добавь решимости: одно смелое действие без долгого разогрева';
  if (element === 'Земля') return 'заземли смысл: сделай запись, оплату, уборку или конкретный план';
  if (element === 'Воздух') return 'проясни словами: сформулируй мысль в одной честной фразе';
  return 'верни чувство: дай себе тишину, воду и признание того, что ты переживаешь';
}

function getSlavicArchetype(message) {
  var text = oracleText(message);
  if (hasAny(text, ['род','семь','мама','отец','судьб','нить'])) return slavicArchetypes[1];
  if (hasAny(text, ['границ','защит','конфликт','зл','сказать','отказать'])) return slavicArchetypes[2];
  if (hasAny(text, ['любов','отнош','партн','серд','близк'])) return slavicArchetypes[3];
  if (hasAny(text, ['конец','отпустить','сон','пауза','расстал','устал'])) return slavicArchetypes[4];
  if (hasAny(text, ['прояв','запуск','успех','дар','деньг','работ'])) return slavicArchetypes[5];
  return slavicArchetypes[0];
}

function buildOracleEngine(message, dateStr, bDay, bMonth) {
  var moon = getMoonPhase(new Date());
  var stage = getAlchemyStage(message);
  var balance = getElementBalance(message);
  var archetype = getSlavicArchetype(message);
  var kb = getKabbalahPractice(dateStr, bDay, bMonth);
  var dr = dailyRune(new Date());
  var ac = activeChakra(dateStr, bDay, bMonth);
  return {

function insight(system, symbol, sphere, light, shadow, practice) {
  return { system:system, symbol:symbol, sphere:sphere, light:light, shadow:shadow, practice:practice };
}

function formatOracleInsights(engine) {
  return Object.keys(engine).map(function(key) {
    var i = engine[key];
    return i.system + ': ' + i.symbol + '. Сфера: ' + i.sphere + '. Свет: ' + i.light + '. Тень: ' + i.shadow + '. Практика: ' + i.practice + '.';
  }).join('\n');
}

function oracleText(message) {
  return ([message || ''].concat(events.map(function(e) { return e.text || ''; }))).join(' ').toLowerCase();
}

function hasAny(text, words) {
  return words.some(function(w) { return text.indexOf(w) >= 0; });
}

function countAny(text, words) {
  return words.reduce(function(n, w) { return n + (text.indexOf(w) >= 0 ? 1 : 0); }, 0);
}

// Лунный календарь
function getMoonPhase(date) {
  var known = new Date(2000, 0, 6, 18, 14);
  var synodic = 29.53059;
  var diff = (date - known) / 86400000;
  var phase = ((diff % synodic) + synodic) % synodic;
  var pct = phase / synodic;
  var phases = [
    { name: 'Новолуние', icon: '\u{1F311}', max: 0.0375 },
    { name: 'Растущий серп', icon: '\u{1F312}', max: 0.125 },
    { name: 'Первая четверть', icon: '\u{1F313}', max: 0.2125 },
    { name: 'Растущая луна', icon: '\u{1F314}', max: 0.375 },
    { name: 'Полнолуние', icon: '\u{1F315}', max: 0.4625 },
    { name: 'Убывающая луна', icon: '\u{1F316}', max: 0.625 },
    { name: 'Последняя четверть', icon: '\u{1F317}', max: 0.7875 },
    { name: 'Убывающий серп', icon: '\u{1F318}', max: 0.9625 },
    { name: 'Новолуние', icon: '\u{1F311}', max: 1.0 }
  ];
  for (var i = 0; i < phases.length; i++) {
    if (pct <= phases[i].max) return { name: phases[i].name, icon: phases[i].icon, day: Math.floor(phase) + 1, pct: pct };
  }
  return { name: phases[0].name, icon: phases[0].icon, day: 1, pct: 0 };
}

function birthTarot(lifePath) {
  var num = lifePath;
  if (num === 22) return tarotMajor[0]; // Мастер 22 = Шут
  while (num > 21) num = reduceNum(num);
  return tarotMajor[num];
}

function yearTarot(bDay, bMonth) {
  var py = personalYear(bDay, bMonth);
  var num = py;
  while (num > 21) num = reduceNum(num);
  return tarotMajor[num];
}

function dailyTarot(date) {
  var seed = date.getFullYear() * 10000 + (date.getMonth()+1) * 100 + date.getDate();
  return tarotMajor[seed % 22];
}

function hashText(value) {
  var text = String(value || '');
  var hash = 0;
  for (var i = 0; i < text.length; i++) {
    hash = ((hash << 5) - hash) + text.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function buildTarotSpread(message) {

    userName,

    new Date().toLocaleDateString('ru-RU'),

  ].join('|'));

    {
      title: 'Ближайший шаг',
      prompt: 'что сделать в ближайшие дни'
    }
  ];

  return positions.map(function(pos, idx) {
    var cardIdx = (seed + idx * 17 + personalDay(userBirth.getDate(), userBirth.getMonth() + 1)) % waiteTarotDeck.length;
    while (used[cardIdx]) cardIdx = (cardIdx + 1) % waiteTarotDeck.length;
    used[cardIdx] = true;
    var card = waiteTarotDeck[cardIdx];
    var reversed = ((seed + idx + cardIdx) % 5) === 0;
    return {
      position: pos.title,

function matrixReduce(n) {
  while (n > 22) n = String(n).split('').reduce(function(a,b) { return a + parseInt(b); }, 0);
  return n;
}

function calcMatrix(day, month, year) {
  var A = matrixReduce(day);
  var B = matrixReduce(month);
  var yearSum = String(year).split('').reduce(function(a,b) { return a + parseInt(b); }, 0);
  var C = matrixReduce(yearSum);
  var D = matrixReduce(A + B + C);

  var E = matrixReduce(A + B);  // зона комфорта
  var F = matrixReduce(B + C);  // зона таланта
  var G = matrixReduce(C + D);  // духовный рост
  var H = matrixReduce(A + D);  // кармический хвост

  var earthLine = matrixReduce(A + E + B);  // линия земли
  var skyLine = matrixReduce(C + G + D);    // линия неба
  var missionPersonal = matrixReduce(E + F); // личное предназначение
  var missionSocial = matrixReduce(G + H);   // социальное предназначение
  var missionGeneral = matrixReduce(missionPersonal + missionSocial); // общее предназначение

  var moneyZone = matrixReduce(E + H);     // зона денег
  var relZone = matrixReduce(F + G);       // зона отношений

  return {
    character: { num: A, desc: arcanEnergies[A] },
    connection: { num: B, desc: arcanEnergies[B] },
    karma: { num: C, desc: arcanEnergies[C] },
    spirit: { num: D, desc: arcanEnergies[D] },
    comfort: { num: E, desc: arcanEnergies[E] },
    talent: { num: F, desc: arcanEnergies[F] },
    growth: { num: G, desc: arcanEnergies[G] },
    tail: { num: H, desc: arcanEnergies[H] },
    earthLine: earthLine,
    skyLine: skyLine,
    missionPersonal: { num: missionPersonal, desc: arcanEnergies[missionPersonal] },
    missionSocial: { num: missionSocial, desc: arcanEnergies[missionSocial] },
    missionGeneral: { num: missionGeneral, desc: arcanEnergies[missionGeneral] },
    money: { num: moneyZone, desc: arcanEnergies[moneyZone] },
    relations: { num: relZone, desc: arcanEnergies[relZone] }
  };
}

function getDayElement(date) {

  var rulers = ['Солнце','Луна','Марс','Меркурий','Юпитер','Венера','Сатурн'];

// Сезон силы знака
function getSeasonPower(signIdx) {
  var now = new Date();
  var currentSign = getZodiac(now.getMonth()+1, now.getDate());
  var diff = ((currentSign - signIdx) + 12) % 12;
  if (diff === 0) return { status: 'Сезон силы', desc: 'Солнце в твоём знаке — максимум энергии' };
  if (diff === 6) return { status: 'Противофаза', desc: 'Солнце напротив — время для баланса' };
  if (diff <= 2 || diff >= 10) return { status: 'Близко к пику', desc: 'Высокая энергия, благоприятный период' };
  return { status: 'Фоновый режим', desc: 'Копи силы, действуй обдуманно' };
}

// SVG матрицы судьбы
function buildMatrixSVG(mx) {
  var w = 300, h = 320;
  var cx = 150, cy = 150;
  var r = 110; // radius of diamond
  var nr = 18; // node radius
  var snr = 14; // small node radius

  var nodes = [
    { x: cx, y: cy - r, num: mx.character.num, label: 'ХАРАКТЕР', main: true },       // 0 top (A)
    { x: cx + r, y: cy, num: mx.connection.num, label: 'СВЯЗЬ', main: true },          // 1 right (B)
    { x: cx, y: cy + r, num: mx.karma.num, label: 'КАРМА', main: true },               // 2 bottom (C)
    { x: cx - r, y: cy, num: mx.spirit.num, label: 'ДУХ', main: true },                // 3 left (D)
    { x: cx + r*0.5, y: cy - r*0.5, num: mx.comfort.num, label: 'КОМФОРТ', main: false }, // 4 top-right (E)
    { x: cx + r*0.5, y: cy + r*0.5, num: mx.talent.num, label: 'ТАЛАНТ', main: false },   // 5 bottom-right (F)
    { x: cx - r*0.5, y: cy + r*0.5, num: mx.growth.num, label: 'РОСТ', main: false },     // 6 bottom-left (G)
    { x: cx - r*0.5, y: cy - r*0.5, num: mx.tail.num, label: 'КАРМ.ХВОСТ', main: false }, // 7 top-left (H)
    { x: cx, y: cy, num: mx.missionGeneral.num, label: 'МИССИЯ', main: true },             // 8 center
  ];

  var lines = [
    [0,4],[4,1],[1,5],[5,2],[2,6],[6,3],[3,7],[7,0], // diamond edges
    [0,2],[1,3], // diagonals
  ];

  var svg = '<svg viewBox="0 0 ' + w + ' ' + (h+10) + '" xmlns="http://www.w3.org/2000/svg">';

  // Lines
  for (var i = 0; i < lines.length; i++) {
    var a = nodes[lines[i][0]], b = nodes[lines[i][1]];
    var cls = (lines[i][0] <= 3 && lines[i][1] <= 3) ? 'matrix-line-main' : 'matrix-line';
    svg += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" class="'+cls+'"/>';
  }

  // Nodes
  for (var j = 0; j < nodes.length; j++) {
    var n = nodes[j];
    var rad = n.main ? nr : snr;
    var circleClass = j === 8 ? 'matrix-node-center' : 'matrix-node-circle';
    svg += '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+rad+'" class="'+circleClass+'"/>';
    svg += '<text x="'+n.x+'" y="'+(n.y+5)+'" text-anchor="middle" class="matrix-num">' + n.num + '</text>';
    var ly = n.y + rad + 12;
    if (j === 2 || j === 5 || j === 6) ly = n.y + rad + 12;
    if (j === 0 || j === 4 || j === 7) ly = n.y - rad - 5;
    if (j === 8) ly = n.y + rad + 13;
    svg += '<text x="'+n.x+'" y="'+ly+'" text-anchor="middle" class="matrix-label">' + n.label + '</text>';
  }

  // Money & Relations labels on sides
  svg += '<text x="'+cx+'" y="'+(h+5)+'" text-anchor="middle" style="fill:#4a3a70;font-size:8px;font-family:inherit;">Деньги: ' + mx.money.num + ' • Отношения: ' + mx.relations.num + '</text>';

  svg += '</svg>';
  return svg;
}

function escapeHtml(value) {

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')

    .replace(/'/g, '&#039;');
}

function analyzeDiaryPatterns() {
  var total = events.length;
  if (total === 0) return [];

  var patterns = diaryPatternRules.map(function(rule) {
    var matched = events.filter(function(e) {
      var text = String(e.text || '').toLowerCase();
      return rule.words.some(function(w) { return text.indexOf(w) >= 0; });
    });
    return {
      title: rule.title,
      desc: rule.desc,
      advice: rule.advice,
      count: matched.length,
      latest: matched.length ? matched[matched.length - 1].date : null
    };
  }).filter(function(p) {
    return p.count >= 2 || (total < 3 && p.count >= 1);
  }).sort(function(a, b) {
    return b.count - a.count;
  });

  return patterns.slice(0, 3);
}

function buildDiaryPatterns() {
  var patterns = analyzeDiaryPatterns();
  var html = '<div class="diary-patterns">' +
    '<div class="diary-section-label"><div class="pattern-icon"><div class="pattern-icon-inner"></div></div>Паттерны</div>';

  if (events.length === 0) {
    html += '<div class="diary-pattern-empty">Пока летопись пуста. Записывай события, и Велес начнёт видеть повторяющиеся нити.</div>';
  } else if (patterns.length === 0) {
    html += '<div class="diary-pattern-empty">Записей уже ' + events.length + ', но устойчивый узор ещё не проявился. Нужно больше событий, чтобы отделить знак от случайности.</div>';
  } else {
    html += patterns.map(function(p) {
      return '<div class="diary-pattern">' +
        '<div class="diary-pattern-top">' +
          '<div class="diary-pattern-title">' + escapeHtml(p.title) + '</div>' +
          '<div class="diary-pattern-count">' + p.count + ' ' + patternEventWord(p.count) + '</div>' +
        '</div>' +
        '<div class="diary-pattern-desc">' + escapeHtml(p.desc) + '</div>' +
        '<div class="diary-pattern-advice">' + escapeHtml(p.advice) + '</div>' +
      '</div>';
    }).join('');
  }

  return html + '</div>';
}

function patternEventWord(n) {
  if (n === 1) return 'событие';
  if (n > 1 && n < 5) return 'события';
  return 'событий';

function updatePatternCount() {

async function askOracle(message) {
  try {
    var eventsForApi = events.map(function(e) {
      return { text: e.text, date: e.date.toLocaleDateString('ru-RU') };
    });

    var ctx = buildEsotericContext(message);
    ctx.events = eventsForApi;
    ctx.message = message;
    ctx.requestMode = oracleMode === 'tarot' ? 'tarot_spread' : 'oracle';
    if (ctx.requestMode === 'tarot_spread') {
      ctx.tarotSpread = buildTarotSpread(message);
    }

    var response = await fetch('/api/oracle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ctx)
    });

    if (!response.ok) throw new Error('API error');
    var data = await response.json();
    return data.reply;
  } catch(err) {
    useAI = false;
    var sign = signsRu[userSignIdx];
    return fallbackResponses[responseIdx % fallbackResponses.length](userName, sign);
  }
}

async function sendMessage() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';

  var chat = document.getElementById('chatArea');
  var d = document.createElement('div');
  d.className = 'msg-user-wrap';
  d.innerHTML = '<div class="msg-user">' + text + '</div>';
  chat.appendChild(d);

  events.push({ text: text, date: new Date() });
  updateDiary();
  saveToStorage();

  var typing = document.createElement('div');
  typing.className = 'msg';
  typing.innerHTML = '<div class="msg-oracle"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  var resp = await askOracle(text);
  responseIdx++;

  if (typing.parentNode) chat.removeChild(typing);

  var evtWord = events.length === 1 ? 'событие' : (events.length < 5 ? 'события' : 'событий');
  var metaText = useAI
    ? (oracleMode === 'tarot' ? 'AI-оракул • расклад таро + ' : 'AI-оракул • карта + ') + events.length + ' ' + evtWord

    setTimeout(function() {
      var pc = document.createElement('div');

  }
